# Usage (from the repository root):
#   cp deploy/.env.example deploy/.env      # fill in secrets
#   cp configs/config.example.yaml configs/config.yaml
#   docker compose -f deploy/docker-compose.yml up -d --build
#   curl -i localhost:8080/healthz
#
# deploy/.env is read twice: by compose for ${...} interpolation below, and as
# env_file for the traderbot container (${VAR} references in config.yaml).

name: traderbot

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  timescaledb:
    # Pinned: the schema's TimescaleDB DDL was written for 2.x. Bump the tag
    # deliberately and re-run the storage integration tests (README).
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traderbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-traderbot}
    volumes:
      - tsdb-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: over TCP, so the entrypoint's socket-only init server
      # (first boot) does not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  traderbot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: traderbot:latest
    restart: unless-stopped
    logging: *logging
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file: .env
    environment:
      # POSTGRES_PASSWORD must be URL-safe (letters, digits, - _ . ~).
      DATABASE_URL: postgres://${POSTGRES_USER:-traderbot}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-traderbot}?sslmode=disable
    # Mount the configs DIRECTORY, not the file: editors save by renaming a new
    # file into place, and a single-file bind mount would keep pointing at the
    # old inode, so hot reload would never see the change.
    volumes:
      - ../configs:/app/configs:ro
    command: ["-config", "/app/configs/config.yaml", "-http", ":8080"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/traderbot", "-healthcheck", "-http", ":8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  tsdb-data:
